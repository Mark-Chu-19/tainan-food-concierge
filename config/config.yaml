# Hermes Agent 設定範本 —— 複製到 ~/.hermes/config.yaml，或用 scripts/setup.sh 合併。
# 祕密（API keys）放 ~/.hermes/.env，不要寫在這裡。

# 讓 Hermes 直接讀本專案的 skills 目錄，不必每次 cp。
# 把下面路徑換成本 repo 的絕對路徑。
external_dirs:
  - "/Users/markchu/Desktop/桌面 - Mark Chu的 MacBook Pro/CMU求職/Foxconn/AI Agent/skills"

mcp_servers:
  # 真實餐廳資料 + 地圖路線（places 搜尋、評分/營業時間、geocode、directions）
  google-maps:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-google-maps"]
    env:
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY}"   # 由 ~/.hermes/.env 提供

  # 政府/店家活動層：Google Sheet 當 CMS（支柱 3）
  # 需要一個能讀 Google Sheets 的 MCP server 與服務帳號憑證。
  # 範例用社群套件；也可換成自寫的簡易 fetch tool 讀公開發布的 CSV。
  google-sheets:
    command: npx
    args: ["-y", "mcp-google-sheets"]
    env:
      # 服務帳號 JSON 路徑，或用公開發布的試算表 CSV 連結（見 data/events.sheet-template.csv）
      SERVICE_ACCOUNT_PATH: "${GOOGLE_SERVICE_ACCOUNT_PATH}"
      DRIVE_FOLDER_ID: "${EVENTS_SHEET_ID}"

  # （加分）Threads 趨勢訊號 —— 若無 MCP，可由 skill 走 web search / 快取退路。
  # threads:
  #   command: npx
  #   args: ["-y", "<threads-mcp-server>"]
  #   env:
  #     THREADS_ACCESS_TOKEN: "${THREADS_ACCESS_TOKEN}"
